name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache acoustic model
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a
          key: ctc-model-fp16-v1

      - name: Fetch acoustic model
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          target=app/src/main/jniLibs/arm64-v8a/libctcmodel.so
          if [ ! -f "$target" ]; then
            curl -L --retry 5 --retry-delay 5 --max-time 1800 -o "$target" \
              https://huggingface.co/onnx-community/wav2vec2-large-xlsr-53-chinese-zh-cn-ONNX/resolve/main/onnx/model_fp16.onnx
          fi
          ls -lh app/src/main/jniLibs/arm64-v8a/
          test $(stat -c%s "$target") -gt 500000000

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Show APK size
        run: ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
